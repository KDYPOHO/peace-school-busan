name: 안드로이드 앱 빌드 (APK)
on:
  push:
    branches: [main, codex/android-play-test]
    paths: ["www/**", "android/**", "scripts/**", "tests/**", "capacitor.config.json", "package*.json", ".github/workflows/android.yml"]
  pull_request:
    paths: ["www/**", "android/**", "scripts/**", "tests/**", "capacitor.config.json", "package*.json", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - name: Maven Central 대신 Google 미러 사용 (GitHub 러너에서 429 오류 방지)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/mirror.gradle <<'G'
          def MIRROR = "https://maven-central.storage-download.googleapis.com/maven2/"
          def swap = { RepositoryHandler repos ->
            repos.withType(MavenArtifactRepository).configureEach { r ->
              if (r.url.toString().startsWith("https://repo.maven.apache.org")) r.url = MIRROR
            }
          }
          settingsEvaluated { s -> swap(s.pluginManagement.repositories) }
          allprojects { p -> swap(p.buildscript.repositories); swap(p.repositories) }
          G
      - run: npm ci
      - run: node --test tests/*.test.mjs
      - run: npx cap sync android
      - name: 디버그 APK 및 서명 전 AAB 빌드
        working-directory: android
        run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug bundleRelease --no-daemon
      - name: 패키지 안의 공통 웹 파일 확인
        run: |
          python3 scripts/verify_web_assets.py android/app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/verify_web_assets.py android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: peace-school-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: peace-school-unsigned-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
      - name: Android 16 에뮬레이터에서 앱 시작 검사
        if: github.ref != 'refs/heads/main'
        run: |
          sudo chmod 666 /dev/kvm
          sdkmanager_bin=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -n "$sdkmanager_bin"
          "$sdkmanager_bin" --sdk_root="$ANDROID_HOME" 'emulator' 'system-images;android-36;google_apis;x86_64'
          export ANDROID_USER_HOME="$RUNNER_TEMP/peace-school-android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$(dirname "$sdkmanager_bin")/avdmanager" create avd --force -n peace-school-api36 -k 'system-images;android-36;google_apis;x86_64' -p "$ANDROID_AVD_HOME/peace-school-api36.avd"
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          emulator -list-avds | grep -Fx peace-school-api36
          emulator -avd peace-school-api36 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/peace-school-emulator.log" 2>&1 &
          export emulator_pid=$!
          trap 'adb emu kill || true' EXIT
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do kill -0 "$emulator_pid" || exit 1; sleep 2; done'
          adb shell input keyevent 82
          adb shell cmd connectivity airplane-mode enable
          cd android
          ./gradlew connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always() && github.ref != 'refs/heads/main'
        with:
          name: android-emulator-evidence
          path: |
            ${{ runner.temp }}/peace-school-emulator.log
            android/app/build/outputs/androidTest-results/connected/
      - name: 누구나 받을 수 있는 시험용 다운로드 링크 갱신 (main에서만)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk peace-school.apk
          NOTE="시험용 안드로이드 앱 (빌드 ${GITHUB_RUN_NUMBER}, $(date -u +%Y-%m-%d)). 휴대폰에서 받아 설치하세요. 설치 방법: docs/TESTING.md"
          if gh release view test-latest >/dev/null 2>&1; then
            gh release upload test-latest peace-school.apk --clobber
            gh release edit test-latest --notes "$NOTE" --prerelease
          else
            gh release create test-latest peace-school.apk --title "시험용 앱 (최신)" --notes "$NOTE" --prerelease --target "$GITHUB_SHA"
          fi
