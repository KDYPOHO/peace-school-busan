name: 안드로이드 앱 빌드 (APK)
on:
  push:
    branches: [main, codex/android-play-test]
    paths: ["www/**", "android/**", "scripts/**", "tests/**", "capacitor.config.json", "package*.json", "firebase.json", "firestore.rules", ".github/workflows/android.yml"]
  pull_request:
    paths: ["www/**", "android/**", "scripts/**", "tests/**", "capacitor.config.json", "package*.json", "firebase.json", "firestore.rules", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - name: Maven Central 대신 Google 미러 사용 (GitHub 러너에서 429 오류 방지)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/mirror.gradle <<'G'
          def MIRROR = "https://maven-central.storage-download.googleapis.com/maven2/"
          def swap = { RepositoryHandler repos ->
            repos.withType(MavenArtifactRepository).configureEach { r ->
              if (r.url.toString().startsWith("https://repo.maven.apache.org")) r.url = MIRROR
            }
          }
          settingsEvaluated { s -> swap(s.pluginManagement.repositories) }
          allprojects { p -> swap(p.buildscript.repositories); swap(p.repositories) }
          G
      - run: npm ci
      - run: npm test
      - run: npm run test:firebase
      - name: Chromium과 WebKit의 교차 흐름 검사
        timeout-minutes: 6
        run: |
          npx playwright install --with-deps chromium webkit
          PSB_BUILD_MODE=development npm run build:web
          npm run test:browser
      - name: Firebase 설정을 포함한 공통 자산 생성
        env:
          PSB_BUILD_MODE: ${{ github.ref == 'refs/heads/main' && 'production' || (vars.PSB_STAGING_PROJECT_ID && 'staging' || 'development') }}
          PSB_STAGING_PROJECT_ID: ${{ vars.PSB_STAGING_PROJECT_ID }}
          PSB_STAGING_FIREBASE_CONFIG: ${{ vars.PSB_STAGING_FIREBASE_CONFIG }}
        run: npm run build:web
      - run: npx cap sync android
      - name: 디버그 APK 및 서명 전 AAB 빌드
        working-directory: android
        run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug bundleRelease --no-daemon
      - name: 패키지 안의 공통 웹 파일 확인
        env:
          PSB_BUILD_MODE: ${{ github.ref == 'refs/heads/main' && 'production' || (vars.PSB_STAGING_PROJECT_ID && 'staging' || 'development') }}
        run: |
          python3 scripts/verify_web_assets.py android/app/build/outputs/apk/debug/app-debug.apk "$PSB_BUILD_MODE"
          python3 scripts/verify_web_assets.py android/app/build/outputs/bundle/release/app-release.aab "$PSB_BUILD_MODE"
      - uses: actions/upload-artifact@v4
        with:
          name: peace-school-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: peace-school-unsigned-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
      - name: 에뮬레이터용 공통 개발 자산 생성
        id: emulator_assets
        if: github.ref != 'refs/heads/main'
        run: |
          PSB_BUILD_MODE=development npm run build:web
          npx cap sync android
      - name: Android 16 에뮬레이터에서 앱 시작 검사
        if: github.ref != 'refs/heads/main'
        run: bash scripts/test_android_emulator.sh 36
      - name: Android 7.0 에뮬레이터에서 최소 지원 환경 검사
        if: ${{ !cancelled() && steps.emulator_assets.outcome == 'success' }}
        run: bash scripts/test_android_emulator.sh 24
      - uses: actions/upload-artifact@v4
        if: always() && github.ref != 'refs/heads/main'
        with:
          name: android-emulator-evidence
          path: |
            ${{ runner.temp }}/peace-school-api*/emulator.log
            ${{ runner.temp }}/peace-school-api*/webview.txt
            ${{ runner.temp }}/peace-school-api*/connected/
      - name: 누구나 받을 수 있는 시험용 다운로드 링크 갱신 (main에서만)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk peace-school.apk
          NOTE="시험용 안드로이드 앱 (빌드 ${GITHUB_RUN_NUMBER}, $(date -u +%Y-%m-%d)). 휴대폰에서 받아 설치하세요. 설치 방법: docs/TESTING.md"
          if gh release view test-latest >/dev/null 2>&1; then
            gh release upload test-latest peace-school.apk --clobber
            gh release edit test-latest --notes "$NOTE" --prerelease
          else
            gh release create test-latest peace-school.apk --title "시험용 앱 (최신)" --notes "$NOTE" --prerelease --target "$GITHUB_SHA"
          fi
