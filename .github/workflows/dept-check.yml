name: 7개 부서 자동 점검
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 부서 점검 (오류가 있으면 실패)
        run: |
          python3 scripts/dept_check.py --format md | tee dept-report.md
          cat dept-report.md >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/dept_check.py > /dev/null
      - name: 점검 규칙 시험
        run: node --test tests/dept-check.test.mjs
