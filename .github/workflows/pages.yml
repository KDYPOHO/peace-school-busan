name: 웹 앱 배포 (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ["www/**", "package*.json", "scripts/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:web
        env:
          PSB_BUILD_MODE: production
      - run: mkdir -p _site && cp -R www/. _site/
      # 간담회 시연용: 서버 연결 없이 가상 자료로만 동작하는 사본 (/demo/)
      - run: npm run build:web && mkdir -p _site/demo && cp -R www/. _site/demo/
        env:
          PSB_BUILD_MODE: demo
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
