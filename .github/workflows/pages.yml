name: 웹 앱 배포 (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ["www/**", "site/**", "package*.json", "scripts/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:web
        env:
          PSB_BUILD_MODE: production
      - name: 소개 누리집(site/)을 /home/ 경로에 함께 배포
        run: python3 site/build.py && mkdir -p www/home && cp -R site/*.html site/css site/js site/img www/home/
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: d
        uses: actions/deploy-pages@v4
